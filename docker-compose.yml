# Local development infrastructure: docker compose up -d
# Compose reads the root .env on its own — it sits next to this file.
# The values are duplicated in DATABASE_URL: Compose cannot assemble a URL from parts,
# so when the credentials change, update it too or the app will fail to connect.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-booking} -d $${POSTGRES_DB:-booking}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
