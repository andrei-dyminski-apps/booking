# Local development infrastructure: docker compose up -d
# Compose reads the root .env on its own — it sits next to this file.
# The values are duplicated in DATABASE_URL and REDIS_URL: Compose cannot assemble a URL
# from parts, so when the credentials or the published port change, update those too or
# the app will fail to connect. Only the host side of a mapping is a variable — the port
# inside the container is what the image listens on and is not ours to move.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-booking} -d $${POSTGRES_DB:-booking}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Backing store for BullMQ: the delayed job that releases an unpaid hold after 15 min.
  # No volume, deliberately — a restart therefore loses every scheduled job, and what makes
  # that survivable is the repeatable sweep in BookingExpiryQueue, which re-reads the
  # bookings themselves once a minute. Losing the queue costs precision, not a slot.
  #
  # noeviction is what BullMQ requires: under any other policy Redis is free to drop the
  # keys a queue is made of, and a job would disappear without anything failing. The
  # default image sets no maxmemory, so nothing is evicted today — this makes it a stated
  # property of the service rather than a side effect of leaving maxmemory unset.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stripe's webhook, brought to a machine Stripe cannot reach: `stripe listen` holds a
  # connection open to Stripe and replays every event of the test account to the API on the
  # host, signed with a secret of its own — the whsec_ it prints at start, which goes into
  # STRIPE_PAYMENT_WEBHOOK_SECRET. The secret stays the same across restarts for one API key.
  #
  # Behind a profile, so `docker compose up -d` without Stripe keys still brings up the
  # database and Redis: `docker compose --profile stripe up -d` starts this one as well.
  stripe:
    image: stripe/stripe-cli:v1.55.1
    profiles: ["stripe"]
    restart: unless-stopped
    # The key goes in through the environment, not the command line, where `docker inspect`
    # and `ps` would print it.
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    command:
      - listen
      - --forward-to
      - http://host.docker.internal:${API_PORT:-3001}/payments/webhook
      # The events the API acts on; the rest would be acknowledged and ignored.
      - --events
      - payment_intent.succeeded,charge.refunded,refund.failed,charge.dispute.created,charge.dispute.closed
    # The API runs on the host, not in this network; on Linux the name needs declaring.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The news about hosts' payout accounts: thin events, which Stripe sends in another format
  # to a route of its own. `stripe listen` has one `--forward-to` per process (v1.55 has no
  # separate thin flag), so they get a process of their own — signed with the same whsec_,
  # which is why the API needs no second secret locally.
  stripe-payouts:
    image: stripe/stripe-cli:v1.55.1
    profiles: ["stripe"]
    restart: unless-stopped
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    command:
      - listen
      - --forward-to
      - http://host.docker.internal:${API_PORT:-3001}/payouts/webhook
      - --events
      - v2.core.account[configuration.recipient].capability_status_updated,v2.core.account[requirements].updated
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db-data:
